
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Nannies{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <!-- Website Header -->
    <header class="site-header">
        <div class="container topbar">

            <h1>Nannies</h1>

            <!-- Navigation Menu -->
            {% include 'nav.html' %}

        </div>
    </header>

    <!-- Main Page Content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Website Footer -->
    <footer>
        <p>&copy; 2026 Nannies. All rights reserved.</p>
    </footer>

</body>
</html>
