<header>

<main>

   

    <p>Welcome back! Please login to your account.</p>

    <form>

        <label for="email">Email:</label>
        <br>
        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <label for="password">Password:</label>
        <br>
        <input type="password"
               id="password"
               name="password"
               required>

        <br><br>

        <input type="submit" value="Login">

    </form>

    <p>
        Don't have an account?
        <a href="register.html">Create an account</a>
    </p>

</main>
